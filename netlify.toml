[build]
  command = "pnpm install --no-frozen-lockfile && pnpm run build:frontend"
  publish = "artifacts/narayani/dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9.15.9"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Google Search Console reads the sitemap from the site root, but it is generated
# by the API function so it always lists the current products and blog posts.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api/sitemap.xml"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
